add('01 · Bài toán','So sánh hai quá trình: phải giữ cả thời điểm biết thông tin',1,'Tóm tắt · §1',

 traits(['Phía trên: bản chất','Khái niệm là gì, được xây như thế nào và vì sao cần nó.'],['Phía dưới: đặc điểm','Điều suy ra từ bản chất, điều kiện áp dụng và giới hạn.'],['Cách học','Dùng ← → hoặc mục lục. Các thanh trượt thay đổi phép tính thật. “Đọc liền” để xem toàn bộ.']));

add('01 · Bài toán','Hai quá trình có cùng kết quả cuối, nhưng biết trước khác nhau',1,'§1.1',
 P('X có hai đường đi: <strong>(−ε, −1)</strong> và <strong>(+ε, +1)</strong>, mỗi đường xác suất 1/2. Nhìn X₁ là biết chắc X₂, dù ε rất nhỏ.')+P('Y cũng kết thúc ở −1 hoặc +1, mỗi giá trị xác suất 1/2. Nhưng cả hai đường đều bắt đầu ở <strong>Y₁ = 0</strong>: tại bước 1 vẫn chưa biết bước 2.')+F('X₂ = dấu(X₁), với ε > 0<br>P(Y₂ = +1 | Y₁ = 0) = 1/2'),
 label('Ví dụ xuyên suốt · ε = 0,3')+svg(txt(120,25,'Quá trình X','#172d2b',17,'middle')+txt(402,25,'Quá trình Y','#172d2b',17,'middle')+line(62,82,203,82)+line(62,156,203,156)+line(350,119,484,82)+line(350,119,484,156)+node(62,82,'−ε')+node(203,82,'−1')+node(62,156,'+ε')+node(203,156,'+1')+node(350,119,'0')+node(484,82,'−1')+node(484,156,'+1')+txt(133,70,'chắc chắn','#126b59',12,'middle')+txt(133,144,'chắc chắn','#126b59',12,'middle')+txt(412,86,'1/2','#52635e',12,'middle')+txt(412,160,'1/2','#52635e',12,'middle')+txt(62,211,'t = 1','#52635e',12,'middle')+txt(203,211,'t = 2','#52635e',12,'middle')+txt(350,211,'t = 1','#52635e',12,'middle')+txt(484,211,'t = 2','#52635e',12,'middle'))+cap('X chọn nút đầu −ε hoặc +ε, mỗi nút xác suất 1/2. Sau đó không còn ngẫu nhiên. Y chỉ có một nút đầu, rồi mới tách nhánh.'),
 traits(['Cùng phân phối cuối','P(X₂ = ±1) = P(Y₂ = ±1) = 1/2. Chỉ kiểm tra bước cuối sẽ bỏ sót khác biệt.'],['Khác thông tin ở bước 1','X đã phân biệt được hai tương lai; Y chưa phân biệt được.'],['Tại sao có ích?','Một quyết định phải chọn trước bước 2 sẽ sử dụng được tín hiệu của X, nhưng không có tín hiệu tương đương từ Y.']));

add('02 · Nền tảng xác suất','Một process là một phân phối trên các đường đi',3,'§3.1 · nền tảng bổ sung',
 P('Một <strong>đường đi</strong> x = (x₁, …, x<sub>T</sub>) ghi các giá trị của một lần chạy. Một <strong>quá trình ngẫu nhiên</strong> X có thể tạo ra nhiều đường đi khác nhau.')+P('<strong>Law</strong> μ là phân phối của X: nó cho mỗi đường đi một xác suất. Trong trường hợp hữu hạn, μ chính là một bảng có tổng xác suất bằng 1.')+F('μ(x) ≥ 0; &nbsp; ∑<sub>x</sub> μ(x) = 1'),
 label('Một law hữu hạn · ví dụ bổ sung')+table(['Đường đi x','X₁','X₂','μ(x)'],[['(0, 0)','0','0','0,10'],['(0, 2)','0','2','0,40'],['(1, 0)','1','0','0,30'],['(1, 2)','1','2','0,20']])+cap('Một dòng = một kịch bản hoàn chỉnh. Cột μ là trọng số của dòng ấy.'),
 traits(['T không phải số mẫu','T là số bước của mỗi đường đi. Số đường đi quan sát được sẽ ký hiệu N.'],['Law chứa sự phụ thuộc','Bảng đường đi giữ mối liên hệ giữa X₁ và X₂, không chỉ từng cột riêng lẻ.'],['Ký hiệu P và μ','P diễn tả xác suất của một sự kiện; μ là tên phân phối của cả quá trình.']));

add('02 · Nền tảng xác suất','Xác suất có điều kiện: lọc đúng nhóm rồi chuẩn hóa lại',3,'§3.1–3.3 · nền tảng bổ sung',
 P('Muốn biết tương lai <strong>sau khi đã thấy X₁ = 0</strong>, bỏ các đường đi có X₁ ≠ 0. Khối xác suất còn lại là 0,10 + 0,40 = 0,50.')+P('Chia khối của mỗi khả năng cho 0,50 để nhóm đang xét có tổng xác suất bằng 1.')+F('P(X₂ = 2 | X₁ = 0)<br>= P(X₁ = 0, X₂ = 2) / P(X₁ = 0)<br>= 0,40 / 0,50 = 0,80'),
 label('Từ bảng đường đi → một hàng chuyển tiếp')+flow(['Giữ (0, 0): khối 0,10; giữ (0, 2): khối 0,40','Tổng của nhóm X₁ = 0: 0,50','Hàng điều kiện: P(0 | 0) = 0,20; P(2 | 0) = 0,80'])+cap('Không điều kiện: P(X₂ = 2) = 0,60. Có điều kiện X₁ = 0: xác suất tăng thành 0,80.'),
 traits(['Dấu | có nghĩa gì?','P(A | B): xác suất của A khi biết B đã xảy ra.'],['Kernel là nhiều hàng như vậy','K(u, a) = xác suất trạng thái kế tiếp là a khi trạng thái hiện tại là u.'],['Mẫu số phải dương','Nếu nhóm B không bao giờ xảy ra, phép chia trên không xác định. Điều này sẽ trở thành giả định của định lý.']));

add('02 · Nền tảng xác suất','Thông tin là khả năng phân biệt các kịch bản',4,'§3.2 · giải thích filtration',
 P('Ở bước 1, hai kịch bản có cùng giá trị X₁ vẫn chưa phân biệt được. Ở bước 2, ta thấy thêm X₂, nên có thể tách nhóm nhỏ hơn.')+P('<strong>Filtration</strong> (hệ thông tin theo thời gian) ghi nhận chính sự phân biệt tăng dần này. Với thông tin tự nhiên của X, nó được tạo bởi lịch sử X₁:ₜ.')+F('ℱ₁ ⊆ ℱ₂ ⊆ … ⊆ ℱ<sub>T</sub>'),
 label('Những đường đi nào vẫn giống nhau đối với người quan sát?')+`<div id="information-viz"></div><div class="controls"><button data-info="1" class="selected">t = 1</button><button data-info="2">t = 2</button></div>`+cap('Bấm bước thời gian để thấy nhóm kịch bản được tách ra. Hình được dựng từ bảng của ví dụ trước.'),
 traits(['X₁:ₜ là một đoạn','X₁:ₜ = (X₁, …, Xₜ), không phải phép chia 1/t.'],['Biết nhiều ≠ giá trị lớn','Giá trị −0,01 có thể tiết lộ hoàn toàn tương lai; giá trị 100 có thể không tiết lộ gì.'],['Phạm vi của paper','Ta xét law của paths cùng thông tin tự nhiên của chúng. Không tự thêm một nguồn thông tin bên ngoài.']));

add('02 · Nền tảng xác suất','Kỳ vọng là cộng các chi phí theo xác suất',4,'§3.2 · nền tảng bổ sung',
 P('Nếu một chi phí C bằng 0 với xác suất 1/2 và bằng 2 với xác suất 1/2, chi phí trung bình là 1. Đây là <strong>kỳ vọng</strong>.')+P('Trong paper, ký hiệu tích phân là cách viết tổng có trọng số cho cả trường hợp hữu hạn lẫn liên tục. Ta có thể hiểu các phép tính ở đây bằng tổng hữu hạn.')+F('E[C] = ∑<sub>kịch bản</sub> xác suất × chi phí<br>= (1/2) × 0 + (1/2) × 2 = 1'),
 metrics([['0','Chi phí khi hai dấu giống nhau'],['2','Chi phí khi hai dấu ngược nhau'],['1','Chi phí kỳ vọng nếu hai dấu độc lập','accent']])+cap('Ở ví dụ ±1, |(+1) − (−1)| = 2 và |(+1) − (+1)| = 0.'),
 traits(['Không phải mọi lần đều trả 1','Kỳ vọng 1 là trung bình có trọng số; một lần chạy có thể trả 0 hoặc 2.'],['Tổng theo thời gian','Với cost cộng dồn, chi phí của một cặp paths là ∑ₜ |xₜ − yₜ|ᵖ.'],['Ký hiệu ∫ f dπ','Đọc là “lấy trung bình f theo xác suất π”. Trên bảng hữu hạn: ∑ᵢⱼ πᵢⱼ fᵢⱼ.']));

add('03 · Ghép hai quá trình','Coupling là một bảng xác suất chung, giữ nguyên xác suất mỗi bên',4,'Định nghĩa 1 · nền tảng',
 P('Biết law μ của X và ν của Y chưa biết chúng xuất hiện cùng nhau như thế nào. <strong>Coupling π</strong> chọn xác suất cho từng cặp đường đi (x, y).')+P('Tổng mỗi hàng phải bằng xác suất của x; tổng mỗi cột phải bằng xác suất của y. Ta được thay mối liên hệ giữa X và Y, nhưng không được thay law riêng của mỗi bên.')+F('∑<sub>j</sub> πᵢⱼ = μᵢ; &nbsp; ∑<sub>i</sub> πᵢⱼ = νⱼ; &nbsp; πᵢⱼ ≥ 0'),
 label('Mỗi bên có hai khả năng, đều xác suất 1/2')+`<div id="coupling-matrix"></div><div class="controls"><label for="coupling-a">a = π₁₁</label><input id="coupling-a" type="range" min="0" max="0.5" step="0.01" value="0.5"><output id="coupling-a-out"></output></div><div class="live-output" id="coupling-result"></div>`,
 traits(['Phân phối biên','“Marginal” là law riêng thu được bằng cách cộng theo bên còn lại.'],['Độc lập chỉ là một lựa chọn','a = 0,25 cho bốn ô bằng 0,25: hai bên độc lập. Coupling nói chung không bắt buộc độc lập.'],['Tối ưu transport làm gì?','Chọn bảng π hợp lệ có kỳ vọng chi phí nhỏ nhất. Ràng buộc theo thời gian chưa xuất hiện ở bước này.']));

add('03 · Ghép hai quá trình','Wasserstein thông thường tối ưu trên các cặp đường đi hoàn chỉnh',1,'§1.1 · §3.2',
 P('Với ví dụ tín hiệu, ghép (−ε, −1) với (0, −1), và (+ε, +1) với (0, +1). Hai giá trị cuối trùng nhau, nên mỗi cặp chỉ tốn ε ở bước 1.')+P('Không coupling nào tốn ít hơn ε vì |X₁ − Y₁| luôn bằng ε. Vậy đây là nghiệm tối ưu của Wasserstein với p = 1.')+F('W₁(μ, ν) = ε + 0 = ε'),
 label('Ghép cùng dấu cuối · ε = 0,3')+matrix(['','Y = (0, −1)','Y = (0, +1)'],[['X = (−0,3, −1)','<b>1/2</b>','0'],['X = (+0,3, +1)','0','<b>1/2</b>']])+cap('Bảng ghép hợp lệ về phân phối biên. Nhưng trong bảng này, nhìn X₁ là biết ngay Y₂.'),
 traits(['W có thấy cả path','W không chỉ nhìn từng thời điểm. Vấn đề là nó cho phép ghép sau khi xét toàn bộ đường đi.'],['Khoảng cách số học nhỏ','ε nhỏ làm tọa độ đầu gần nhau; tọa độ cuối được ghép trùng khít.'],['Khác biệt thông tin vẫn lớn','Trong Y, bước 1 chưa cho biết dấu cuối. Bảng ghép trên lại để X₁ tiết lộ dấu cuối của Y.']));

add('03 · Ghép hai quá trình','Nhân quả nghĩa là không dùng tương lai của nguồn để ghép hiện tại',4,'Định nghĩa 1',
 P('Một coupling <strong>causal từ X sang Y</strong> phải thỏa: nếu đã biết lịch sử X₁:ₜ, biết thêm tương lai X<sub>t+1:T</sub> không được giúp dự đoán lịch sử Y₁:ₜ tốt hơn.')+F('P(Y₁:ₜ | X₁:ₜ, X<sub>t+1:T</sub>)<br>= P(Y₁:ₜ | X₁:ₜ)')+note('Dạng chuẩn: Y₁:ₜ độc lập có điều kiện với X<sub>t+1:T</sub>, khi đã biết X₁:ₜ. Mọi xác suất ở đây được xét dưới law chung π.'),
 label('Tại bước t · các đầu vào hợp lệ')+flow(['Đã có: X₁:ₜ và sự ngẫu nhiên dùng để ghép','Tạo lịch sử Y₁:ₜ với đúng luật điều kiện','Không được đọc X<sub>t+1</sub>, …, X<sub>T</sub> trước thời điểm của chúng'])+cap('Cách đọc theo thao tác chỉ để giải thích điều kiện xác suất; coupling vẫn là một law chung trên hai paths.'),
 traits(['Không phải “có ảnh hưởng vật lý”','Causal ở đây là ràng buộc về thông tin trong một phép ghép xác suất.'],['Vẫn có thể phụ thuộc quá khứ','Y₁:ₜ được phép phụ thuộc lịch sử X₁:ₜ. Điều bị cấm là phần thông tin thêm từ tương lai X.'],['Một chiều chưa đủ','Giữ nhân quả X → Y chưa chắc giữ nhân quả Y → X. So sánh adapted cần cả hai.']));

add('03 · Ghép hai quá trình','Bicausal giữ thông tin đúng theo cả hai chiều',4,'Định nghĩa 1',
 P('Một coupling <strong>bicausal</strong> (song nhân quả) phải causal từ X sang Y và từ Y sang X. Lịch sử của bên kia không được tiết lộ thêm tương lai của mình, sau khi đã biết lịch sử của mình.')+P('Ở coupling cùng dấu cuối, biết Y₁ = 0 chưa biết Y₂. Nhưng biết thêm X₁ = +ε lại suy ra Y₂ = +1. Vì thế coupling ấy vi phạm chiều Y → X.')+F('P(Y₂ = +1 | Y₁ = 0) = 1/2<br>P(Y₂ = +1 | Y₁ = 0, X₁ = +ε) = 1'),
 label('Kiểm tra coupling ở slide trước')+proof([['X → Y: điều kiện ở t = 1 không bị vi phạm','Y₁ luôn bằng 0, nên X₂ không tiết lộ gì thêm về Y₁.'],['Y → X: bị vi phạm','X₁ tiết lộ dấu của Y₂ dù Y₁ chưa tiết lộ dấu đó.'],['Kết luận: không bicausal','Giữ đúng phân phối biên vẫn chưa đủ.']]),
 traits(['Điều kiện đối xứng','Phải kiểm tra cả hai chiều; không chỉ hỏi Y có “nhìn trước X” không.'],['Không cấm tương quan','Hai bên vẫn có thể dùng chung sự ngẫu nhiên mới khi đến thời điểm được phép.'],['Giữ luật tương lai','Ở mỗi cặp histories hợp lệ, mỗi bên phải giữ nguyên law chuyển tiếp điều kiện của riêng nó.']));

add('03 · Ghép hai quá trình','Tự tính adapted distance của ví dụ: ε + 1',4,'§1.1 · §3.2–3.3',
 P('Tại bước 1, chi phí luôn là ε. Sau khi biết X₁, tương lai X₂ đã cố định. Nhưng luật Y₂ vẫn phải là đồng xu cân bằng, kể cả khi biết X₁.')+P('Vì thế ở bước 2: xác suất 1/2 trùng dấu, tốn 0; xác suất 1/2 ngược dấu, tốn 2. Chi phí tương lai bằng 1.')+F('AW₁ = ε + (1/2 × 0 + 1/2 × 2)<br>= ε + 1, &nbsp; ε > 0'),
 label('Thay độ lớn tín hiệu; khả năng biết dấu vẫn nguyên')+`<div id="epsilon-viz"></div><div class="controls"><label for="epsilon">ε</label><input id="epsilon" type="range" min="0.01" max="1" step="0.01" value="0.3"><output id="epsilon-out"></output></div><div class="live-output" id="epsilon-result"></div>`+cap('Tại ε = 0 chính xác, tín hiệu biến mất, hai laws trùng nhau và AW = 0. Công thức ε + 1 chỉ dùng với ε > 0.'),
 traits(['Vì sao là nghiệm tối ưu?','Ràng buộc bicausal bắt buộc Y₂ cân bằng ở mỗi nhánh X₁. Không có cách giảm chi phí bước 2.'],['Khi ε tiến về 0','W tiến về 0; AW tiến về 1. Tín hiệu nhỏ về biên độ vẫn có thể chứa toàn bộ thông tin.'],['Topology là gì ở đây?','Hai cách đo cho hai ý nghĩa khác nhau của “tiến gần”. Đây là nội dung cụ thể của khác biệt topology.']));

add('03 · Ghép hai quá trình','Đọc trọn công thức AW: chọn phép ghép hợp lệ có chi phí thấp nhất',4,'Định nghĩa 1',
 P('Cpl<sub>bc</sub>(μ, ν) là tập tất cả coupling bicausal của hai laws. <strong>inf</strong> là cận dưới tốt nhất của các chi phí; trên bài toán hữu hạn này ta tìm được minimum.')+F('AW<sub>p</sub><sup>p</sup>(μ, ν)<br>= inf<sub>π ∈ Cpl<sub>bc</sub>(μ,ν)</sub> E<sub>π</sub>[∑<sub>t=1</sub><sup>T</sup> |Xₜ − Yₜ|<sup>p</sup>]')+P('Nếu p = 2, đệ quy trả tổng bình phương trung bình tối ưu. Muốn lấy AW₂ phải căn bậc hai kết quả ấy.'),
 label('Công thức được tạo bởi bốn thao tác')+flow(['|Xₜ − Yₜ|ᵖ: phạt chênh lệch tại một bước','∑ₜ: cộng chi phí qua toàn bộ thời gian','Eπ: lấy trung bình trên các cặp paths','inf trên Cplbc: chọn law ghép bicausal tốt nhất']),
 traits(['AW ≥ W','Tập coupling bicausal nhỏ hơn tập coupling bất kỳ, nên giá trị tối ưu không thể thấp hơn W.'],['Chú ý lũy thừa p','V₀ = AWₚᵖ, không phải AWₚ nói chung. Deck chủ yếu dùng p = 1 để tự tính dễ hơn.'],['Cost và probability khác nhau','Cost nằm ở |x − y|ᵖ; xác suất nằm trong π. Nhân hai thứ rồi cộng mới ra kỳ vọng.']));

add('04 · Đệ quy lồng nhau','Tách một bài toán dài thành các bài toán sau mỗi cặp lịch sử',4,'§3.3',
 P('Giả sử đã thấy x₁:ₜ và y₁:ₜ. Hai laws cho ta hai phân phối bước kế tiếp: μ<sub>t+1|x₁:ₜ</sub> và ν<sub>t+1|y₁:ₜ</sub>.')+P('Ta ghép hai phân phối này, trả chi phí của bước mới, rồi cộng chi phí tối ưu còn lại. Vì bicausality giữ nguyên hai luật điều kiện, ta có thể giải từng bài toán cục bộ như vậy.')+F('chi phí một lựa chọn kế tiếp<br>= cost ngay sau đó + cost tương lai'),
 label('Một cặp histories → các cặp bước tiếp theo')+svg(node(80,115,'u,v')+line(103,115,275,55)+line(103,115,275,115)+line(103,115,275,175)+txt(290,59,'(a₁, b₁) → c(a₁,b₁) + V tiếp', '#172d2b',15)+txt(290,119,'(a₁, b₂) → c(a₁,b₂) + V tiếp','#172d2b',15)+txt(290,179,'(a₂, b₂) → c(a₂,b₂) + V tiếp','#172d2b',15)+txt(142,40,'trọng số π₁₁','#126b59',12)+txt(142,105,'trọng số π₁₂','#126b59',12)+txt(142,184,'trọng số π₂₂','#126b59',12))+cap('u, v ở phần này là lịch sử đầy đủ. V là chi phí còn lại sau khi đã tới trạng thái được chỉ ra.'),
 traits(['V là một hàm','Mỗi cặp histories có một giá trị V khác nhau. V không phải một số chung cho mọi nhánh.'],['Lồng nhau ở đâu?','Giá trị tối ưu ở bước sau được đặt bên trong bài toán tối ưu ở bước trước.'],['Không tối ưu từng bước riêng','Ghép có cost hiện tại thấp có thể dẫn vào cặp histories có tương lai rất đắt.']));

add('04 · Đệ quy lồng nhau','Vì sao tính lùi: cần biết tương lai tốn bao nhiêu trước khi chọn',4,'§3.3',
 P('Đặt V<sub>T</sub> = 0: đã đi hết T bước thì không còn chi phí nào. Tính V<sub>T−1</sub> trước, rồi V<sub>T−2</sub>, …, cuối cùng V₀ ở gốc.')+F('Vₜ(u,v) = min<sub>πₜ</sub> ∑<sub>a,b</sub> πₜ(a,b)<br>× [c<sub>t+1</sub>(a,b) + V<sub>t+1</sub>(u·a,v·b)]')+note('u·a là nối giá trị a vào lịch sử u. πₜ phải có hai biên bằng đúng hai laws bước kế tiếp tại u và v.'),
 label('Đánh chỉ số chi phí · T = 2')+flow(['V₂ = 0: không còn bước nào','V₁: ghép bước 2, cộng c₂ + 0','V₀: ghép bước 1, cộng c₁ + V₁','Kết quả chính xác: V₀ = AWₚᵖ']),
 traits(['Không tính trùng cost','Vₜ chỉ chứa chi phí từ bước t+1 trở đi. cₜ đã được tính khi đi tới bước t.'],['Một bài LP ở mỗi cặp nút','LP = tối ưu tuyến tính trên các ô πₜ, với ràng buộc tổng hàng/cột và không âm.'],['Nút thắt tính toán','Có nhiều cặp histories; mỗi cặp lại cần giải một LP. ATSW sẽ giảm cả hai gánh nặng này.']));

add('04 · Đệ quy lồng nhau','Chạy đệ quy bằng tay trên ví dụ ε = 0,3',4,'§3.3 · tính từ ví dụ §1.1',
 P('Ở cặp histories (+0,3; 0), luật X₂ là [0, 1] trên {−1,+1}, còn luật Y₂ là [1/2,1/2]. Chỉ có một coupling có đúng các biên đó.')+F('V₁(+0,3; 0) = 1/2 × 2 + 1/2 × 0 = 1<br>V₁(−0,3; 0) = 1')+P('Tại gốc, mỗi nhánh X₁ có xác suất 1/2. Mỗi nhánh trả 0,3 ngay lập tức và 1 về sau.'),
 label('Các con số thực sự đi vào công thức')+proof([['Cuối đường: V₂ = 0','Không còn cost tiếp theo.'],['Sau bước 1: V₁ = 1 ở cả hai nhánh','Một bên biết dấu, một bên vẫn phải ngẫu nhiên cân bằng.'],['Ở gốc: V₀ = ½(0,3 + 1) + ½(0,3 + 1) = 1,3','Đây là AW₁, vì đang dùng cost |x − y|.']]),
 traits(['Không cần solver ở ví dụ này','Khi một law điều kiện là khối điểm, các ràng buộc biên đã xác định toàn bộ coupling.'],['Từ cây đến một số','V truyền cost từ lá về gốc; xác suất biến các giá trị con thành trung bình.'],['Tự kiểm tra','Nếu Y cũng tiết lộ dấu cuối ở bước 1 giống X, hai laws có thể được ghép cùng nhánh mà không vi phạm thông tin.']));

add('04 · Đệ quy lồng nhau','Có cây theo thời gian vẫn chưa đủ: cách đọc cây quyết định kết quả',4,'§4.1 · tiếp tr. 5',
 P('Một cây giữ quan hệ giữa lịch sử và phần tiếp diễn. Nhưng nếu cách tính khoảng cách chỉ cộng chênh lệch khối trên cây, hoặc ghép các paths theo thứ tự một lần, nó chưa thực hiện các ràng buộc điều kiện.')+P('Paper thử ba cách đọc trên cùng cây của ví dụ ε = 0,3. Chỉ cách đọc lồng nhau trả đúng 1,3.'),
 label('Cùng cấu trúc · khác phép tính')+metrics([['4,0','Flat tree-Wasserstein khi làm mịn lưới','bad'],['0,3','Một lượt ghép theo thứ tự từ điển'],['1,3','Đệ quy nested','accent']])+cap('Đây là các giá trị paper báo cáo cho phép dựng của nó. Bản thảo thiếu hình gốc và chưa cho đủ chi tiết để suy ra riêng con số 4,0.'),
 traits(['Từ điển = sắp theo tọa độ','So tọa độ đầu, nếu bằng nhau mới so tiếp. Sắp theo thời gian không tự tạo ràng buộc bicausal.'],['Ghép và điều kiện không đổi chỗ','Ghép toàn bộ rồi mới nhìn nhóm có thể tạo một luật tương lai sai trong từng nhóm.'],['Điểm phải giữ trong ATSW','Ghép cục bộ nằm bên trong đệ quy. “Tree” trong tên không phải là toàn bộ ý tưởng.']));

add('05 · Ghép phân vị','ATSW thay bài tối ưu cục bộ bằng một quy tắc ghép có công thức',4,'§3.4 · §4.2',
 P('Nếu hai law nằm trên các giá trị đã sắp tăng dần, ta có thể ghép phần xác suất thấp với phần thấp, rồi phần tiếp theo với phần tiếp theo. Đây là <strong>comonotone coupling</strong>, hay ghép cùng thứ tự phân vị.')+P('Để dựng nó, cần biết xác suất tích lũy: đã đi qua bao nhiêu khối khi đi từ trái sang phải trên trục giá trị.')+F('p = (0,2; 0,5; 0,3)<br>F = (0,2; 0,7; 1,0)'),
 label('CDF = cộng dồn xác suất')+table(['Giá trị aᵢ','Xác suất pᵢ','Tích lũy Fᵢ'],[['0','0,2','0,2'],['1','0,5','0,2 + 0,5 = 0,7'],['2','0,3','0,7 + 0,3 = 1']])+cap('Fᵢ = P(X ≤ aᵢ). Ta thêm F₀ = 0 để viết thống nhất mọi khoảng.'),
 traits(['Trục giá trị và trục xác suất','Giá trị là 0,1,2; CDF là 0,2; 0,7; 1. Chúng là hai loại đại lượng khác nhau.'],['Không ghép đều các điểm','Điểm có xác suất 0,5 phải được cấp nhiều khối hơn điểm có xác suất 0,2.'],['Điều kiện thứ tự','Trên một chiều có thứ tự tự nhiên. Với trạng thái đa chiều, việc chọn thứ tự và mở rộng không tự động tương đương.']));

add('05 · Ghép phân vị','Cùng một U ∈ [0,1] tạo ra hai giá trị đúng phân phối',4,'§3.4 · giải thích Eq. (1)',
 P('Chia [0,1] thành các đoạn có độ dài pᵢ. U rơi vào đoạn thứ i thì chọn aᵢ. Vì U phân bố đều, xác suất chọn aᵢ đúng bằng độ dài pᵢ.')+P('Làm tương tự cho q nhưng dùng <strong>cùng U</strong>. Cặp (aᵢ, bⱼ) được chọn khi U nằm trong phần giao của hai đoạn.')+F('X = F⁻¹(U), &nbsp; Y = G⁻¹(U)<br>U ∼ Uniform[0,1]'),
 label('Một thước xác suất chung · kéo U')+`<div id="quantile-u-viz"></div><div class="controls"><label for="quantile-u">U</label><input id="quantile-u" type="range" min="0.001" max="0.999" step="0.001" value="0.45"><output id="quantile-u-out"></output></div><div class="live-output" id="quantile-u-result"></div>`,
 traits(['F⁻¹ ở đây là phân vị','Chọn giá trị đầu tiên có CDF ≥ U. Không phải 1/F.'],['Mỗi biên vẫn đúng','Dùng chung U tạo tương quan nhưng không thay phân phối của từng bên.'],['Điểm biên không gây khác biệt','Một điểm đơn lẻ của U có xác suất 0; quy ước đóng/mở đầu đoạn không đổi khối ghép.']));

add('05 · Ghép phân vị','Công thức min/max chỉ là độ dài giao của hai đoạn',4,'Eq. (1)',
 P('Đoạn của aᵢ chạy từ Fᵢ₋₁ đến Fᵢ; đoạn của bⱼ chạy từ Gⱼ₋₁ đến Gⱼ. Phần giao kết thúc ở đầu phải nhỏ hơn, bắt đầu ở đầu trái lớn hơn.')+F('ℓᵢⱼ(p,q) = [min(Fᵢ,Gⱼ)<br>− max(Fᵢ₋₁,Gⱼ₋₁)]₊')+P('Ví dụ hai đoạn (0,2; 0,7] và (0,2; 0,8] giao nhau trên độ dài 0,5. Nếu không giao nhau, lấy 0 thay vì số âm.'),
 label('Tính một ô: i = 2, j = 2')+svg(line(55,65,505,65,'#d5ded2',10)+line(145,65,370,65,'#126b59',14)+line(55,130,505,130,'#d5ded2',10)+line(145,130,415,130,'#b7502f',14)+line(145,185,370,185,'#88b850',16)+txt(55,35,'p₂: từ 0,2 đến 0,7')+txt(55,105,'q₂: từ 0,2 đến 0,8')+txt(145,218,'Phần giao = 0,7 − 0,2 = 0,5','#126b59',15)+txt(135,49,'0,2','#52635e',11)+txt(358,49,'0,7','#52635e',11)+txt(403,114,'0,8','#52635e',11)),
 traits(['[z]₊ = max(z,0)','Độ dài không thể âm. Đây là lý do có dấu “+” nhỏ bên ngoài ngoặc.'],['Tổng hàng/cột tự đúng','Các đoạn của q chia trọn [0,1], nên tổng phần giao với đoạn pᵢ đúng bằng pᵢ; tương tự cho qⱼ.'],['Không có tối ưu trong công thức','ℓ được xác định từ p và q; nó không xem ma trận cost để chọn một coupling khác.']));

add('05 · Ghép phân vị','Từ các phần giao đến chi phí: một ví dụ tính hết',4,'§3.4 · ví dụ cùng p,q của §5.3',
 P('Lấy p = (0,2; 0,5; 0,3) và q = (0,2; 0,6; 0,2) trên các giá trị {0,1,2}. Các ô có khối được đọc từ những phần giao trên thước U.')+F('QC(p,q; M) = ∑ᵢⱼ ℓᵢⱼ Mᵢⱼ<br>Mᵢⱼ = |aᵢ − bⱼ|')+P('Chỉ ô (2,1) có khối khác 0 và cost khác 0: khối 0,1 × cost 1. Vậy QC = 0,1.'),
 label('Ma trận ℓ · hàng X, cột Y')+matrix(['','Y = 0','Y = 1','Y = 2','Tổng'],[['X = 0','0,2','0','0','0,2'],['X = 1','0','0,5','0','0,5'],['X = 2','0','<b>0,1</b>','0,2','0,3'],['Tổng','0,2','0,6','0,2','1']])+cap('Paper dùng chữ M vừa trong ký hiệu ma trận cost vừa ở nơi khác cho số cặp quan sát. Deck sẽ gọi số cặp quan sát là M<sub>obs</sub> khi cần tránh nhầm.'),
 traits(['QC = comonotone cost','QC chỉ là tổng có trọng số theo coupling ℓ đã chọn.'],['Nếu có tương lai','Trong đệ quy, Mᵢⱼ = c(aᵢ,bⱼ) + V tiếp theo, chứ không chỉ |aᵢ − bⱼ|.'],['Chi phí tính','Sau khi sắp support, có thể quét các đoạn bằng hai con trỏ. Paper báo O(b log b) tính cả sắp xếp.']));

add('05 · Ghép phân vị','Vì sao ghép cùng thứ tự tốt trong bài toán một bước?',4,'§3.4 · giải thích điều kiện cost',
 P('Với cost |x − y| trên một chiều, ghép chéo không thể tốt hơn ghép cùng thứ tự. Chẳng hạn X có {0,2}, Y có {1,3}, mỗi điểm xác suất 1/2.')+F('Cùng thứ tự: ½|0−1| + ½|2−3| = 1<br>Ghép chéo: ½|0−3| + ½|2−1| = 2')+P('Điều kiện cấu trúc thích hợp là bất đẳng thức <strong>Monge</strong>: chi phí hai cặp cùng thứ tự không lớn hơn hai cặp chéo.'),
 label('Cost có cấu trúc; không chỉ support có thứ tự')+matrix(['Cost |x−y|','Y = 1','Y = 3'],[['X = 0','<b>1</b>','3'],['X = 2','1','<b>1</b>']])+F('M₁₁ + M₂₂ ≤ M₁₂ + M₂₁')+cap('Cùng thứ tự: hai ô đường chéo chính. Tính chất tương tự đúng cho |x−y|ᵖ với p ≥ 1 trên một chiều.'),
 traits(['Thứ tự chưa đủ để tối ưu','Cần cost có cấu trúc phù hợp. Ma trận tùy ý không có bảo đảm này.'],['Paper viết “monotone costs”','Ở đây diễn giải bằng tính chất Monge cụ thể, để tránh hiểu nhầm thành mọi cost tăng theo một biến.'],['Đối chiếu lý thuyết','Tính tối ưu của ghép Knothe–Rosenblatt trong bài toán nhiều bước còn cần giả định về laws điều kiện; xem <a href="https://www-stat.aau.at/robinson/adapted-wasserstein-sdes.pdf" target="_blank" rel="noopener">nghiên cứu gốc liên quan</a>.']));

add('05 · Ghép phân vị','Cost tương lai có thể đảo ngược lựa chọn tốt nhất',8,'§5.5 · ví dụ tự dựng để giải thích coupling gap',
 P('Cho X gồm (−1,−10), (+1,+10); Y gồm (−1,+10), (+1,−10), mỗi path xác suất 1/2. Cả hai đều biết tương lai của mình từ bước 1.')+P('Ghép cùng giá trị bước 1 tốn 0 ngay lúc đó nhưng tốn 20 về sau. Ghép chéo tốn 2 ngay lúc đó nhưng tương lai trùng nhau.')+F('M = cost bước 1 + V bước 2<br>Ghép cùng thứ tự: 20; &nbsp; ghép chéo: 2'),
 label('Ma trận tổng cost tại gốc · ví dụ bổ sung')+matrix(['M','Y₁ = −1','Y₁ = +1'],[['X₁ = −1','<span class="red">0 + 20 = 20</span>','<b>2 + 0 = 2</b>'],['X₁ = +1','<b>2 + 0 = 2</b>','0 + 20 = 20']])+cap('Cả hai coupling đều bicausal: sau bước 1, tương lai mỗi bên đã được xác định bởi lịch sử riêng. Ghép phân vị ở gốc chọn đường chéo chính.'),
 traits(['Sai khác do quy tắc ghép','Ở đây không có sai số lấy mẫu, lưới hay cửa sổ. Chỉ việc thay min bằng ℓ đã đổi đáp án từ 2 thành 20.'],['Nguyên nhân đại số','M₁₁ + M₂₂ = 40 > 4 = M₁₂ + M₂₁. Cost cộng tương lai đã phá cấu trúc Monge.'],['Đừng khái quát số thực nghiệm','Gap 10–20% trong benchmark của paper không phải cận trên cho mọi bài toán. Ví dụ này không phải kết quả paper báo cáo.']));

add('06 · Dựng ATSW','Biết cây, biết mô hình và chỉ có paths là ba loại đầu vào khác nhau',2,'§1.2 · §2.1–2.3',
 P('<strong>Scenario tree</strong> ghi các histories thành nút và xác suất đi tiếp trên các nhánh. Khi cây đã được cho sẵn, ta có sẵn những laws điều kiện để đưa vào đệ quy.')+P('Nếu biết mô hình, ta có thể lấy mẫu các bước tiếp theo tại một trạng thái cần xét. Nếu chỉ có paths, ta phải suy ra các laws điều kiện từ các lần chuyển tiếp đã xuất hiện trong dữ liệu.'),
 label('Khác biệt nằm ở những gì được phép sử dụng')+proof([['Tree-given: cho sẵn cây và xác suất nhánh','Giải đệ quy trên cây; việc học ra cây chưa nằm trong đầu vào này.'],['Model-given: truy vấn kernel chuyển tiếp','Có thể sinh thêm successors sau trạng thái cần xét.'],['Path-only: chỉ có các lần chạy đã quan sát','Phải chia nhóm, đếm và chấp nhận các nhóm ít dữ liệu.']]),
 traits(['Vì sao sliced/static tree OT nhanh?','Các cách chiếu hoặc dùng tree metric tĩnh có phép ghép dễ tính nhưng không tự thực hiện ràng buộc filtration của bài toán adapted.'],['ATSW giữ phần khó ở đâu?','Đặt coupling có công thức bên trong đệ quy nested; từ “tree” hay “sliced” một mình chưa bảo đảm tôn trọng information.'],['Đối chiếu đúng phạm vi','Bản thảo phân nhóm phương pháp như trên. Không dùng bảng tốc độ để bỏ qua khác biệt dữ liệu đầu vào và phần việc học kernel.']));

add('06 · Dựng ATSW','Bốn phép thay thế biến lý thuyết thành thuật toán từ dữ liệu',5,'Algorithm 1 · §4.2',
 P('Đầu vào chỉ là hai tập đường đi mẫu. Ta không được gọi một mô hình để sinh thêm các tương lai sau một history tùy chọn.')+P('ATSW tạo trạng thái hữu hạn bằng lưới, giữ một đoạn lịch sử ngắn, ước lượng laws chuyển tiếp bằng đếm, rồi chạy đệ quy với coupling ℓ. Cuối cùng lấy trung bình qua nhiều vị trí dịch lưới.'),
 label('Luồng tính toán · vẫn giữ đệ quy theo thời gian')+flow(['Giá trị thực → chỉ số ô của lưới cố định','Lịch sử dài → cửa sổ k chỉ số ô gần nhất','Law điều kiện → tần suất chuyển tiếp quan sát được','LP tối ưu → coupling phân vị ℓ có công thức','Chạy nhiều shift → lấy trung bình giá trị ở gốc']),
 traits(['Dữ liệu đầu vào','Paths chỉ cho những chuyển tiếp đã xảy ra. Không có quyền truy vấn kernel thật.'],['Các xấp xỉ khác nhau','Lưới, cửa sổ và quy tắc coupling làm đổi đối tượng. Đếm hữu hạn làm phát sinh sai số thống kê.'],['Điểm được giữ lại','Cộng cost tương lai và tính lùi theo thời gian. Đây là thành phần nested của thuật toán.']));

add('06 · Dựng ATSW','Lượng tử hóa: đưa giá trị vào ô và dùng tâm ô để tính cost',5,'Algorithm 1 · dòng 1',
 P('Chọn độ rộng ô δ > 0 và dịch lưới s. Giá trị x nằm trong ô có chỉ số C. Thay x bằng tâm ô r(C) khi tính chi phí.')+F('C(x) = ⌊(x − s)/δ⌋<br>r(C) = s + δ(C + 1/2)')+P('δ = 0,5; s = 0; x = 0,62 cho C = 1 và r = 0,75. Dấu ⌊·⌋ làm tròn xuống số nguyên.'),
 label('Kéo x qua biên ô · δ = 0,5; s = 0')+`<div id="grid-viz"></div><div class="controls"><label for="grid-x">x</label><input id="grid-x" type="range" min="-0.95" max="1.45" step="0.01" value="0.62"><output id="grid-x-out"></output></div><div class="live-output" id="grid-result"></div>`,
 traits(['Ô là khoảng nửa mở','C = j nghĩa là s+jδ ≤ x < s+(j+1)δ. Với x âm, floor vẫn làm tròn xuống: floor(−0,2) = −1.'],['Sai số tọa độ','|x−r(C)| ≤ δ/2. Nhưng điều này chưa chặn được sai số thông tin khi hai histories bị gộp.'],['Hữu hạn là giả thiết cần kiểm tra','Lưới trên toàn ℝ có vô hạn ô. Định lý dùng mô hình hữu hạn; miền hữu hạn/cắt miền cho dữ liệu không bị chặn chưa được bản thảo mô tả đầy đủ.']));

add('06 · Dựng ATSW','Lưới không chỉ đổi con số; nó còn đổi điều có thể biết',5,'§4.2 · hệ quả của lượng tử hóa',
 P('Nếu hai giá trị ở bước 1 rơi vào cùng ô, thuật toán xem chúng là cùng trạng thái. Những tương lai vốn phân biệt được nhờ hai giá trị ấy giờ bị gộp vào một law điều kiện.')+P('Vì vậy lưới thô làm giảm số nhóm để đếm, nhưng đồng thời có thể xóa thông tin dự báo. Lưới mịn giữ thông tin tốt hơn, đổi lại mỗi nhóm có ít quan sát hơn.'),
 label('Ví dụ hai tín hiệu bị nhập vào cùng ô')+proof([['Dữ liệu gốc: X₁ = −0,1 hoặc +0,1','Mỗi dấu cho biết X₂ = −1 hoặc +1.'],['Chọn ô [−0,25; +0,25)','Cả −0,1 và +0,1 đều có tâm đại diện 0.'],['Sau khi gộp: cùng trạng thái đầu, hai tương lai','Law điều kiện thực nghiệm trở thành hỗn hợp của hai nhánh.']]),
 traits(['Đây là thay đổi information','Không thể chỉ dùng cận δ/2 cho tọa độ rồi kết luận adapted distance sai ít.'],['Biên lưới có ảnh hưởng','Nếu 0 là biên ô, hai tín hiệu có thể nằm hai ô khác nhau. Cùng δ nhưng khác s có thể giữ thông tin khác nhau.'],['Mịn hơn chưa chắc tốt hơn','Với số mẫu cố định, thêm nhiều ô có thể làm việc ước lượng law điều kiện kém ổn định.']));

add('06 · Dựng ATSW','Dịch lưới giúp giảm phụ thuộc vào vị trí biên ô',1,'Tóm tắt · §4',
 P('Một giá trị nằm sát biên có thể được phân vào ô rất khác khi lưới dịch nhẹ. ATSW chạy trên nhiều shift rồi lấy trung bình để kết quả bớt phụ thuộc vào một cách đặt biên cụ thể.')+F('ATSW trung bình = (1/L) ∑<sub>ℓ=1</sub><sup>L</sup> V̂₀(sℓ)')+note('L là số shift. Paper nêu phép lấy trung bình, nhưng chưa đưa một định lý riêng khi số shift tăng hoặc lưới được làm mịn.'),
 label('Các điểm cố định; chỉ biên lưới dịch')+`<div id="shift-viz"></div><div class="controls"><label for="grid-shift">s / δ</label><input id="grid-shift" type="range" min="0" max="1" step="0.01" value="0.2"><output id="grid-shift-out"></output></div><div class="live-output" id="shift-result"></div>`,
 traits(['Không xóa mọi sai lệch','Lấy trung bình không tự khôi phục thông tin đã mất do cửa sổ ngắn hay sửa gap của coupling phân vị.'],['Cố định khi đếm','Với một shift đã chọn, biên và tâm ô không thay theo mẫu. Đây là ý nghĩa “fixed grid”.'],['Trung bình hữu hạn','Nếu từng giá trị theo shift hội tụ dưới các giả định cần thiết, trung bình của số hữu hạn giá trị ấy cũng hội tụ. Đây là suy luận trực tiếp.']));

add('06 · Dựng ATSW','Cửa sổ k: giữ lại chính xác phần lịch sử nào?',5,'§4.2 · window of length k',
 P('Sau lượng tử hóa, lịch sử đầy đủ là (C₁,…,Cₜ). Cửa sổ k chỉ giữ k chỉ số ô gần nhất, hoặc toàn bộ phần đã có nếu t < k.')+F('Uₜ = (C<sub>max(1,t−k+1)</sub>, …, Cₜ)')+P('Hai histories có cùng Uₜ được gộp khi ước lượng law bước tiếp theo. Bấm k để xem hai histories sau có bị gộp không.'),
 label('Hai histories có cùng đoạn cuối nhưng khác quá khứ xa')+`<div id="window-viz"></div><div class="controls"><button data-window="1">k = 1</button><button data-window="2" class="selected">k = 2</button><button data-window="3">k = 3</button></div><div class="live-output" id="window-result"></div>`,
 traits(['Giới hạn số trạng thái','Nếu có b ô, mỗi tầng có tối đa bᵏ cửa sổ khi t ≥ k. Tổng qua T tầng vẫn có thể tăng theo T.'],['Cập nhật cửa sổ','Thêm ô mới vào cuối, bỏ ô cũ nhất nếu chiều dài vượt k.'],['Cây thành trạng thái có nhớ','Gộp những histories có cùng hậu tố có thể tạo cấu trúc dùng chung nút; không còn là cây đầy đủ của mọi history.']));

add('06 · Dựng ATSW','Giả thiết k-Markov nói rằng quá khứ bị bỏ không còn giúp dự báo',7,'Remark 6 · §6.3',
 P('Một quá trình là <strong>k-Markov</strong> nếu khi đã biết k trạng thái gần nhất, biết thêm quá khứ xa hơn không làm đổi law bước tiếp theo.')+F('P(C<sub>t+1</sub> | C₁,…,Cₜ)<br>= P(C<sub>t+1</sub> | C<sub>t−k+1</sub>,…,Cₜ)')+P('Nếu điều này sai, gộp histories thành cửa sổ là một xấp xỉ có mất thông tin. Nhiều dữ liệu hơn sẽ giúp học đúng law đã gộp, nhưng không tự lấy lại phần quá khứ đã bỏ.'),
 label('Phân biệt hai giả thiết thường đi cùng nhau')+proof([['k-Markov: phụ thuộc vào đoạn cuối dài k','Nói về lượng quá khứ cần giữ.'],['Time-homogeneous: cùng một quy tắc K qua các thời điểm','Nói về việc luật chuyển tiếp có đổi theo t không.'],['Stationary: phân phối không đổi khi dịch thời gian','Mạnh hơn việc chỉ có kernel không đổi; liên quan đến cách gộp các cặp thành mẫu cùng law.']]),
 traits(['Không tự suy ra sau lượng tử hóa','Một process Markov trước lượng tử hóa có thể mất tính Markov sau khi gộp trạng thái.'],['K nhỏ và K lớn','k nhỏ dễ có nhiều mẫu mỗi nhóm nhưng dễ mất nhớ; k lớn giữ nhớ hơn nhưng chia dữ liệu nhỏ hơn.'],['Phạm vi hình thức','Paper mô tả formal statement với kernel không đổi theo thời gian, trong thiết lập stationary k-Markov, và giả thiết lấy mẫu riêng.']));

add('06 · Dựng ATSW','Ước lượng kernel bằng đếm: từ dữ liệu sang xác suất',6,'§5.1 · count-based kernel',
 P('Với mỗi trạng thái nguồn u, đếm số lần đã thấy u và số lần sau u là a. Tỷ số là xác suất chuyển tiếp ước lượng.')+F('K̂(u,a) = số cặp (u,a) / số cặp có nguồn u')+P('Ví dụ quan sát từ u được 2 lần đến a = 0 và 8 lần đến a = 1. Hàng kernel ước lượng là (0,2; 0,8). Đây chính là phép tính xác suất điều kiện bằng tần suất.'),
 label('Dữ liệu ít hay nhiều: công thức giống nhau')+`<div id="counts-viz"></div><div class="controls"><label for="count-one">Số lần đến 1 / 10</label><input id="count-one" type="range" min="0" max="10" step="1" value="8"><output id="count-one-out"></output></div><div class="live-output" id="counts-result"></div>`,
 traits(['Tổng hàng bằng 1','Mọi lần rời u phải đi vào một ô kế tiếp trong mô hình hữu hạn.'],['Không có kernel oracle','ATSW tái dựng K từ những gì đã quan sát; model-based method có thể truy vấn hoặc lấy mẫu trực tiếp từ K thật.'],['Cặp khác đường đi','Một path dài cung cấp nhiều cặp liên tiếp, nhưng các cặp đó thường phụ thuộc nhau. Không được mặc nhiên xem là mẫu độc lập.']));

add('06 · Dựng ATSW','Chưa thấy một trạng thái: phải định nghĩa cả trường hợp 0/0',5,'§4.2 · Remark 5',
 P('Nếu nguồn u chưa xuất hiện trong mẫu, số cặp từ u bằng 0. Khi đó tỷ số đếm là 0/0, không phải xác suất 0.')+P('ATSW dùng <strong>hàng đồng đều</strong> trong trường hợp này. Với b trạng thái đích, mỗi đích nhận 1/b. Nhờ đó, ở mọi cỡ mẫu, kernel ước lượng luôn có các hàng xác suất hợp lệ.')+F('K̂(u,a) = { đếm(u,a)/đếm(u), nếu đếm(u)>0;<br>&nbsp;&nbsp; 1/b, nếu đếm(u)=0 }'),
 label('Chưa có dữ liệu không đồng nghĩa biết xác suất thật')+matrix(['Nguồn','Đến 0','Đến 1','Đến 2'],[['u chưa thăm','1/3','1/3','1/3']])+cap('Đây là quy ước để thuật toán được xác định. Không phải khẳng định rằng kernel thật của u là đồng đều.'),
 traits(['Vì sao chứng minh cần nó?','Bước ổn định của đệ quy yêu cầu đầu vào là vector xác suất. Một hàng NaN hoặc toàn 0 phá điều kiện ấy.'],['Về lâu dài','Nếu nguồn có xác suất dương và lấy mẫu phù hợp, số lần thăm cuối cùng sẽ dương; fallback không còn được dùng cho nguồn đó.'],['Nếu nguồn có xác suất bằng 0','Không thể học riêng hàng kernel thật tại nguồn ấy bằng tỷ số. Định lý paper loại trường hợp này bằng reachability.']));

add('06 · Dựng ATSW','Vì sao toàn bộ lịch sử làm dữ liệu bị chia quá nhỏ?',10,'§6.2 · cơ chế thống kê',
 P('Giả sử có b ô khả dĩ mỗi bước. Số histories có thể tăng tới bᵗ ở độ sâu t, trong khi N đường đi chỉ cung cấp N lần ghé ở tầng ấy.')+P('Nếu phần lớn nhóm chỉ có một quan sát, hàng kernel thực nghiệm trở thành một khối điểm: mẫu làm tương lai trông như đã chắc chắn, dù law thật chưa chắc chắn.')+F('Số quan sát trung bình mỗi nhóm<br>≈ N / bᵗ &nbsp; (chỉ minh họa khi nhóm cân bằng)'),
 label('N = 10.000, b = 4 · kịch bản nhóm cân bằng')+table(['Độ dài history','Số nhóm 4ᵗ','Quan sát / nhóm'],[['2','16','625'],['4','256','39,1'],['6','4.096','2,44'],['8','65.536','0,15']])+cap('Số nhóm thực tế có thể nhỏ hơn và tần suất không đều. Bảng giải thích cơ chế, không phải một định lý lower bound.'),
 traits(['Khó khăn là thông tin trong mẫu','Một thuật toán tính nhanh hơn không tự tạo thêm các continuation chưa được quan sát.'],['Cửa sổ thay bᵗ bằng bᵏ','Giảm số nhóm cần học, nhưng đánh đổi với lượng quá khứ được giữ.'],['Cẩn thận với phát biểu tổng quát','Paper gọi đây là “informational limit”; số mũ n⁻⁰·¹⁹ là fit thực nghiệm, không phải chứng minh bất khả thi cho mọi estimator path-only.']));

add('06 · Dựng ATSW','Viết lại thuật toán ATSW bằng các đối tượng đã hiểu',5,'Algorithm 1',
 P('Mỗi giá trị V̂ₜ(u,v) là chi phí tương lai dưới các kernel ước lượng và quy tắc ghép cùng phân vị. Không còn phép min tại mỗi cặp nút.')+F('V̂ₜ(u,v) = ∑<sub>a,b</sub> ℓ<sub>ab</sub>(K̂ˣ(u,·), K̂ʸ(v,·))<br>× [c(r(a),r(b)) + V̂<sub>t+1</sub>(u′,v′)]')+note('u′,v′ là cửa sổ sau khi thêm a,b; “·” trong K̂(u,·) lấy cả hàng. Ở gốc, cửa sổ rỗng và hai hàng là phân phối bước đầu.'),
 label('Một lần chạy tại một shift')+flow(['Tạo chỉ số ô và tâm đại diện cho mọi path','Gộp theo cửa sổ; đếm các hàng K̂ của hai bên','Khởi tạo V̂T = 0','Đi lùi: dựng ℓ → nhân với c + V̂ tiếp → cộng','Trả V̂₀ ở gốc; lặp lại nếu dùng nhiều shift']),
 traits(['Cùng nguyên lý đệ quy','Tương lai vẫn đi vào ma trận cost ở bước trước. Nhưng ℓ không chọn tối ưu theo ma trận đó.'],['Chỉ duyệt phần có khối','Paper dùng cách tính phụ thuộc số cặp nút/đoạn thực sự được ghé, thay vì tất cả tổ hợp có thể có.'],['Chưa có cận tổng quát dưới bậc hai','Số mũ chi phí dưới bậc hai trong paper là đo trên các cấu hình thử. Không phải cận worst-case cho mọi T và N.']));

add('07 · Định lý hội tụ','Hội tụ về cái gì? Tách ba đối tượng trước khi đọc định lý',6,'Theorem 4 · Remark 6',
 P('Gọi V* là AW chính xác trên process ban đầu. Sau khi chọn lưới, cửa sổ và coupling phân vị, ta có một đối tượng khác: <strong>V(K₀)</strong>, chạy đệ quy ấy bằng kernel thật của mô hình đã chọn.')+P('Dữ liệu hữu hạn chỉ cho K̂, nên ta tính V(K̂). Định lý 4 chứng minh V(K̂) tiến đến V(K₀), dưới các giả định được nêu.')+F('Được chứng minh: V(K̂) → V(K₀)<br>Chưa suy ra: V(K̂) → V*'),
 label('Đích ước lượng và đích lý tưởng')+flow(['V*: adapted OT chính xác của process gốc','Đổi lưới / cửa sổ / coupling → V(K₀)','Thay kernel thật bằng tỷ số đếm → V(K̂)'])+cap('Mũi tên hội tụ khi tăng mẫu chỉ nối V(K̂) với V(K₀). Việc nối tiếp về V* cần các kết quả xấp xỉ khác.'),
 traits(['Consistency có nghĩa cụ thể','Với đối tượng cố định và mẫu tăng, estimator tiến tới đúng giá trị của đối tượng đó.'],['Sai số cấu trúc có thể còn','Lấy vô hạn mẫu không làm ghép phân vị biến thành LP, cũng không làm cửa sổ ngắn nhớ lại quá khứ đã bỏ.'],['Định lý không chọn tham số','Nó chưa cho quy tắc tăng k, giảm δ hay tăng miền theo số mẫu để tiến tới AW của process gốc.']));

add('07 · Định lý hội tụ','“Gần như chắc chắn” nói về cả dãy ước lượng khi mẫu tăng',6,'Theorem 4 · giải thích hội tụ',
 P('Tưởng tượng một chuỗi dữ liệu kéo dài mãi. Mỗi khi có thêm dữ liệu, ta tính lại V̂₁, V̂₂, … Hội tụ gần như chắc chắn nói rằng với xác suất 1, dãy giá trị đó tiến tới V(K₀).')+F('P(lim<sub>M→∞</sub> V(K̂<sub>M</sub>) = V(K₀)) = 1')+P('Phát biểu này không nói rằng một mẫu hữu hạn cụ thể đã gần đích đến mức nào, hoặc dãy phải tiến gần đơn điệu.'),
 label('Minh họa khái niệm · không phải dữ liệu paper')+svg(line(50,185,520,185)+line(50,25,50,185)+line(50,95,520,95,'#b7502f',2)+`<polyline points="55,30 80,150 110,55 145,125 180,70 220,111 260,84 310,104 360,89 410,99 465,92 515,96" fill="none" stroke="#126b59" stroke-width="3"/>`+txt(60,22,'Giá trị ước lượng','#52635e',12)+txt(415,83,'V(K₀)','#b7502f',12)+txt(355,215,'Số cặp quan sát M →','#52635e',12)),
 traits(['Xác suất 1 không phải mọi mẫu','Cho phép một tập ngoại lệ có xác suất 0.'],['Hội tụ không cho tốc độ','Không thể từ định lý này kết luận 10.000 mẫu đủ để sai số dưới 1%.'],['Không tự cho khoảng tin cậy','Muốn định lượng độ bất định ở mẫu hữu hạn cần thêm kết quả về tốc độ hoặc phân phối sai số.']));

add('07 · Định lý hội tụ','Ba điều kiện làm chuỗi chứng minh có thể bắt đầu',6,'Assumptions 2–3 · Theorem 4',
 P('<strong>Reachability:</strong> mọi trạng thái nguồn trong mô hình có xác suất dương. <strong>Sampling:</strong> các cặp được gộp có cùng phân phối, đo được và độc lập từng đôi theo Assumption 3.')+P('Thêm mô hình hữu hạn, cost bị chặn và kernel không đổi theo thời gian trong formal statement. Fallback bảo đảm K̂ là kernel hợp lệ ngay cả khi mẫu còn nhỏ.'),
 label('Điều kiện → bước cần đến nó')+proof([['Xác suất nguồn dương','Cho mẫu số của tỷ số tần suất tiến tới một số > 0.'],['Cùng law và giả thiết độc lập','Cho áp dụng luật số lớn lên các chỉ báo đếm.'],['Cost bị chặn |Mᵢⱼ| ≤ B, hữu hạn số trạng thái','Cho biến sai số của trọng số ghép thành sai số cost hữu hạn.']]),
 traits(['Độc lập từng đôi và i.i.d.','Assumption 3 ghi “pairwise independent”; Remark 6 mô tả mô hình formal là i.i.d. Bản thảo dùng hai cách diễn đạt có độ mạnh khác nhau.'],['Một path tạo cặp phụ thuộc','(C₁,C₂) và (C₂,C₃) có chung C₂. Điều kiện của định lý không tự đúng chỉ vì các paths độc lập nhau.'],['Đo được nghĩa là gì?','Các sự kiện dùng để đếm phải thuộc những sự kiện mà mô hình xác suất gán được xác suất. Trong ví dụ hữu hạn, điều này không gây khó.']));

add('07 · Định lý hội tụ','Bước 1: tần suất đúng dần thì hàng kernel cũng đúng dần',6,'Proof sketch · bước (vi)',
 P('Đặt f̂(u,a) là tỷ lệ cặp có nguồn u và đích a, f̂(u) là tỷ lệ cặp có nguồn u. Luật số lớn làm hai tần suất này hội tụ về xác suất tương ứng.')+F('f̂(u,a) → P(u,a); &nbsp; f̂(u) → P(u) > 0<br>K̂(u,a) = f̂(u,a)/f̂(u)<br>→ P(u,a)/P(u) = K₀(u,a)')+P('Vì P(u) > 0, mẫu số cuối cùng sẽ dương. Từ thời điểm đó trở đi, hàng fallback không còn tham gia.'),
 label('Ví dụ tỷ số · xác suất thật giả định')+table(['','Đồng thời (u,a)','Nguồn u','Tỷ số'],[['Giới hạn thật','0,12','0,30','0,40'],['Một mẫu hữu hạn','0,11','0,29','≈ 0,379'],['Một mẫu khác lớn hơn','0,1205','0,301','≈ 0,400']])+cap('Các tần suất minh họa được tự dựng; không phải khẳng định tỷ số luôn tốt hơn mỗi khi tăng mẫu.'),
 traits(['Reachability dùng đúng chỗ','Giới hạn mẫu số dương cho phép lấy giới hạn của phép chia.'],['Ô rất hiếm vẫn khó','“Dương” có thể rất nhỏ. Định lý vẫn đúng nhưng cần nhiều mẫu mới có đủ lần thăm.'],['Hữu hạn giúp đồng thời','Có hữu hạn hàng/ô nên hội tụ từng ô dẫn tới hội tụ của toàn bộ kernel theo chuẩn hữu hạn phù hợp.']));

add('07 · Định lý hội tụ','Bước 2: đổi xác suất một ít thì CDF đổi một ít',6,'Proof sketch · bước (i)',
 P('Chuẩn ℓ₁ của hai vector xác suất là tổng độ lệch tuyệt đối ở mọi ô. Đây là một số đo lượng thay đổi của cả hàng.')+F('‖p − p′‖₁ = ∑ᵢ |pᵢ − p′ᵢ|')+P('Mỗi CDF chỉ là một tổng từ ô đầu tới ô i. Độ lệch của tổng con ấy không thể lớn hơn tổng độ lệch của toàn bộ hàng.')+F('|Fᵢ − F′ᵢ| ≤ ‖p − p′‖₁'),
 label('Tính trực tiếp một cận ổn định')+proof([['p = (0,20; 0,50; 0,30)','F = (0,20; 0,70; 1,00)'],['p′ = (0,22; 0,47; 0,31)','F′ = (0,22; 0,69; 1,00)'],['‖p−p′‖₁ = 0,02 + 0,03 + 0,01 = 0,06','Mọi độ lệch CDF: 0,02; 0,01; 0 đều ≤ 0,06.']]),
 traits(['Lipschitz là một cận tỉ lệ','|đầu ra đổi| ≤ L × |đầu vào đổi|. Với CDF ở đây, có thể lấy L = 1.'],['Không yêu cầu trơn','Một hàm có góc vẫn có thể Lipschitz. Ví dụ |x| có góc tại 0 nhưng | |x|−|y| | ≤ |x−y|.'],['Cận không cần sắc nhất','0,06 lớn hơn độ lệch CDF thực tế trong ví dụ. Chứng minh chỉ cần một cận hợp lệ.']));

add('07 · Định lý hội tụ','Bước 3: min/max không khuếch đại vô hạn sai số CDF',6,'Proof sketch · bước (i)–(ii)',
 P('Trọng số ℓ được tạo từ min, max, trừ và lấy phần dương. Các phép này thay đổi có kiểm soát khi các đầu vào thay đổi ít.')+F('|ℓᵢⱼ(p,q) − ℓᵢⱼ(p′,q′)|<br>≤ 2(‖p−p′‖₁ + ‖q−q′‖₁)')+P('Nhân sai lệch từng trọng số với cost bị chặn B, rồi cộng qua n×m ô, ta được cận mà paper dùng cho QC.'),
 label('Từ trọng số đến tổng chi phí')+F('|QC(p,q;M) − QC(p′,q′;M)|<br>≤ 2nmB(‖p−p′‖₁ + ‖q−q′‖₁)')+proof([['n, m = số ô của hai bên','Không phải số đường đi trong bất đẳng thức này.'],['B chặn độ lớn của từng Mᵢⱼ','Sai số xác suất × cost bị chặn → sai số cost bị chặn.']]),
 traits(['Ma trận M đang được giữ cố định','Ở bước kế tiếp cần xét thêm việc continuation value làm M thay đổi.'],['Tại điểm CDF bằng nhau','min/max vẫn liên tục và Lipschitz. Đây chưa phải chỗ gây thất bại của consistency.'],['Sẽ có vấn đề khác','Để suy ra phân phối Gaussian của sai số, cần tuyến tính hóa; min/max tại điểm bằng nhau có thể không tuyến tính hóa được theo cách thông thường.']));

add('07 · Định lý hội tụ','Bước 4: truyền cận sai số từ cuối đường về gốc',6,'Proof sketch · bước (iii)–(v)',
 P('Một bước đệ quy có hai nguồn sai khác: hàng kernel đổi nên ℓ đổi; và giá trị tương lai đổi nên ma trận c + V đổi.')+P('Tách hai thay đổi này bằng cách cộng trừ một giá trị trung gian. Sau đó dùng cận QC cho phần kernel và tính chất trung bình có trọng số cho phần V.')+F('sai số ở bước t<br>≤ hằng số × sai số kernel<br>+ hằng số × sai số ở bước t+1'),
 label('Khung chứng minh · T hữu hạn')+flow(['Cuối đường: V̂T − VT = 0','Một bước: kernel gần + continuation gần ⇒ giá trị gần','Lặp hữu hạn lần đến t = 0','K̂ → K₀ ⇒ V(K̂) → V(K₀)'])+cap('Đây là diễn giải cấu trúc chứng minh. Các hằng số đệ quy tường minh chưa được bản thảo trình bày đầy đủ ở phụ lục A.'),
 traits(['Tại sao đủ để hội tụ?','T và số trạng thái được giữ cố định. Một hằng số hữu hạn nhân một sai số tiến về 0 vẫn tiến về 0.'],['Tại sao không cho tốc độ hữu ích?','Paper báo hằng số formal tăng cỡ (nm)ˢ qua s bước. Nó có thể rất lớn dù hợp lệ.'],['Chưa giải quyết dữ liệu phụ thuộc','Ổn định của phép đệ quy không tự chứng minh luật số lớn phù hợp cho các cặp phụ thuộc trong một path.']));

add('07 · Định lý hội tụ','Lean kiểm tra các bước suy luận, với đúng những giả thiết đã khai báo',6,'§5.2 · Table 3 · Appendix B',
 P('Chứng minh hình thức biến định nghĩa, giả thiết và từng bước suy luận thành đối tượng Lean có thể kiểm tra. Một mệnh đề không suy ra từ các tiền đề sẽ không được chấp nhận.')+P('Paper báo 35 kết quả, 613 dòng, không có <code>sorry</code>. Ba điểm phải viết rõ là: nguồn có xác suất dương, hàng fallback hợp lệ và xác suất biên bằng tổng xác suất chung.'),
 label('Chuỗi định lý trong Table 3')+flow(['CDF Lipschitz → trọng số ℓ hợp lệ và Lipschitz','QC ổn định → một bước đệ quy ổn định','Nhiều bước ổn định → kernel gần kéo theo V gần','Luật số lớn → tỷ số đếm hội tụ','Kết luận: Vdp_consistent_ae']),
 traits(['Điều kiểm tra được','Tính đúng logic của phát biểu đã được mã hóa; không tự xác nhận mọi giả định có đúng trên dữ liệu thực tế hay không.'],['Thông tin do paper báo cáo','Axioms: propext, Classical.choice, Quot.sound. Workspace này không có Atsw.lean để tự build hoặc đối chiếu báo cáo.'],['Không thay thế các kết quả còn thiếu','Lean không tự chặn coupling gap, chứng minh tính metric hay đưa ra quy tắc chọn k,δ khi những phần đó chưa được chứng minh.']));

add('08 · Sai số không Gaussian','Hội tụ và hình dạng của sai số là hai câu hỏi khác nhau',7,'§5.3 · Proposition 7',
 P('Consistency nói V̂ − V tiến về 0. Nhưng nếu muốn lập khoảng tin cậy, ta còn cần biết độ lệch ấy phân bố ra sao khi mẫu lớn.')+P('Ở nhiều bài toán, tỷ lệ đếm có dao động cỡ 1/√N. Nhân sai số với √N giúp nhìn hình dạng dao động còn lại, thay vì chỉ nhìn một đám điểm co về 0.')+F('Sai số thô: V̂ − V → 0<br>Sai số phóng đại: √N(V̂ − V) ⇒ một law giới hạn'),
 label('Cùng sự hội tụ · hai đại lượng cần phân biệt')+metrics([['V̂ − V','Co về 0 khi tăng mẫu','accent'],['√N(V̂ − V)','Có thể giữ một phân phối giới hạn không tầm thường']])+cap('Dấu ⇒ ở đây là hội tụ về phân phối. Không có nghĩa hai biến ngẫu nhiên bằng nhau.'),
 traits(['Gaussian là một law cụ thể','Phân phối chuẩn có dạng chuông đối xứng. Một estimator hội tụ không nhất thiết có sai số giới hạn chuẩn.'],['Ý tưởng delta method','Nếu đầu vào có dao động Gaussian và hàm đầu ra có xấp xỉ bậc nhất tuyến tính, đầu ra chuẩn hóa thường cũng Gaussian.'],['Chỗ cần xem xét ở ATSW','Hàm đầu ra dùng min/max. Tại chỗ hai CDF bằng nhau, xấp xỉ bậc nhất có thể có dấu trị tuyệt đối.']));

add('08 · Sai số không Gaussian','Trên {0,1,2}, cost ghép bằng tổng độ lệch của hai CDF',7,'Proposition 7 · dẫn xuất bổ sung',
 P('Với cost |x−y| và khoảng cách giữa các giá trị bằng 1, khối lệch qua mỗi ranh giới phải di chuyển ít nhất một đơn vị. Ghép cùng phân vị đạt đúng tổng chi phí này.')+F('V = |F₁ − G₁| + |F₂ − G₂|')+P('Với p = (0,2; 0,5; 0,3), q = (0,2; 0,6; 0,2), ta có F₁ = G₁ = 0,2 và F₂ − G₂ = 0,7 − 0,8 = −0,1. Do đó V = 0 + 0,1 = 0,1.'),
 label('Một điểm cắt bằng nhau, một điểm cắt cách nhau')+table(['Ranh giới','F của p','G của q','Cost đóng góp'],[['0 | 1','0,2','0,2','|0| = 0'],['1 | 2','0,7','0,8','|−0,1| = 0,1']])+cap('Khi khoảng cách giữa các support không bằng 1, mỗi |F−G| được nhân thêm độ rộng khoảng tương ứng.'),
 traits(['Tie = CDF trùng ở điểm cắt','Không phải hai samples có giá trị trùng nhau; đây là đẳng thức của hai xác suất tích lũy thật.'],['Công thức này là một bước','Nó đủ tạo phản ví dụ Gaussian. Không cần một cây nhiều tầng phức tạp.'],['Giá trị thật đã biết','V = 0,1 là tâm mục tiêu trước khi lấy mẫu. Phân phối của V̂ quanh V là câu hỏi tiếp theo.']));

add('08 · Sai số không Gaussian','Tại điểm bằng nhau, nhiễu hai phía đều làm trị tuyệt đối tăng',7,'§5.3 · cơ chế min/max',
 P('Đặt d = F−G. Nếu d = −0,1 và nhiễu h rất nhỏ, dấu vẫn âm nên |d+h|−|d| = −h: đây là biểu thức tuyến tính theo h.')+P('Nếu d = 0, thay đổi thành |h|. Nhiễu dương hay âm đều làm cost tăng. Không có một hệ số tuyến tính duy nhất mô tả cả hai phía.')+F('d ≠ 0: thay đổi cục bộ ≈ dấu(d) × h<br>d = 0: thay đổi = |h|'),
 label('Kéo nhiễu quanh điểm góc')+`<div id="kink-viz"></div><div class="controls"><label for="kink-h">h</label><input id="kink-h" type="range" min="-0.08" max="0.08" step="0.001" value="0.04"><output id="kink-h-out"></output></div><div class="live-output" id="kink-result"></div>`,
 traits(['Vẫn liên tục','h nhỏ thì |h| nhỏ. Consistency không bị phá.'],['Nhưng không tuyến tính','Hàm |h| gấp phần âm sang dương. Gaussian đưa qua hàm này tạo một thành phần có trung bình dương.'],['Phân biệt hai mức lý thuyết','Lipschitz đủ cho lập luận hội tụ; khả vi thích hợp mới cho phép dùng delta method thông thường.']));

add('08 · Sai số không Gaussian','Tự suy ra |A| + B từ hai ranh giới',7,'Proposition 7 · dẫn xuất bổ sung',
 P('Gọi A là giới hạn của √N[(F̂₁−Ĝ₁)−0]. Tại ranh giới đầu, lấy trị tuyệt đối cho đóng góp |A|.')+P('Gọi D là giới hạn dao động của F̂₂−Ĝ₂ quanh −0,1. Vì dấu ở ranh giới thứ hai vẫn âm khi N lớn, đóng góp của cost là −D. Đặt B = −D.')+F('√N(V̂−V) ⇒ |A| + B'),
 label('Hai mẫu độc lập, mỗi mẫu có N quan sát')+proof([['A và B cùng Gaussian, nhưng không độc lập','Các CDF trong cùng một mẫu sử dụng chung quan sát.'],['Var(A) = 0,2×0,8 + 0,2×0,8 = 0,32','Var là phương sai: trung bình bình phương độ lệch quanh trung bình.'],['E[|A|+B] = √0,32 × √(2/π) ≈ 0,4514','Với Gaussian tâm 0, E|A| = độ lệch chuẩn × √(2/π); E[B] = 0.']])+cap('Dẫn xuất bổ sung cho Appendix A. Mỗi CDF là tỷ lệ các quan sát thuộc một nhóm (biến đếm 0/1), nên phương sai một quan sát là p(1−p).'),
 traits(['Tại sao trung bình dương?','Ranh giới đang tie có cost thật bằng 0. Nhiễu mẫu tạo một chênh lệch có độ lớn dương ở hai hướng.'],['Vẫn có thể hội tụ về V','Bias của V̂ ở thang gốc cỡ 0,4514/√N trong ví dụ này, nên biến mất khi N tăng.'],['Không sửa bằng đổi variance','Một xấp xỉ chuẩn tâm 0 không tái hiện trung bình dương này. Thay độ rộng không sửa được sai tâm.']));

add('08 · Sai số không Gaussian','Hình dạng giới hạn: nhìn tác động của phép lấy trị tuyệt đối',7,'§5.3 · minh họa phân phối',
 P('Biểu đồ mô phỏng law |A|+B từ các tham số của ví dụ. Đường chuẩn so sánh có cùng phương sai nhưng tâm 0. Trục ngang là sai số đã nhân √N; diện tích dưới mỗi đường biểu thị xác suất.')+F('Var(A) = 0,32; &nbsp; Var(B) = 0,37<br>Cov(A,B) = −0,10')+note('Cov là hiệp phương sai: giá trị âm ở đây biểu thị hai dao động có xu hướng ngược chiều. Mô phỏng dùng hạt giống cố định, không phải dữ liệu gốc của paper.'),

const deck=document.getElementById('deck');
deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.cls||''}" id="slide-${i+1}" aria-labelledby="title-${i+1}"><div class="eyebrow"><span>${s.ch}</span><span class="source"><a href="paper.pdf#page=${s.page}" target="_blank" rel="noopener">${s.section} · PDF tr. ${s.page} ↗</a></span></div><h1 id="title-${i+1}">${s.title}</h1><div class="essence"><div class="zone-label"><span class="index">01</span> Bản chất · hiểu cách nó hoạt động</div><div class="essence-grid"><div class="prose">${s.body}</div><div class="visual">${s.visual}</div></div></div><div class="traits"><div class="zone-label"><span class="index">02</span> Đặc điểm · hệ quả, điều kiện, giới hạn</div><div class="traits-grid">${s.ts.map(t=>`<div class="trait"><h3>${t.h}</h3><p>${t.p}</p></div>`).join('')}</div></div></section>`).join('');
const sections=[...document.querySelectorAll('.slide')],toc=document.getElementById('toc'),pageInput=document.getElementById('page-number');
let current=0,reading=false;
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const fmt=(n,d=2)=>n.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
function setToc(open){toc.hidden=!open;document.getElementById('toc-toggle').setAttribute('aria-expanded',open);if(open)document.getElementById('search').focus();}
function renderToc(query=''){
 let prev=''; const q=query.toLocaleLowerCase('vi');
 document.getElementById('toc-list').innerHTML=slides.map((s,i)=>{
  if(q&&!`${s.ch} ${s.title} ${s.body} ${s.ts.map(x=>x.p).join(' ')}`.toLocaleLowerCase('vi').includes(q))return '';
  let group=s.ch!==prev?`<div class="toc-group">${s.ch}</div>`:'';prev=s.ch;
  return group+`<a class="toc-link ${i===current?'current':''}" href="#${i+1}" data-goto="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s.title}</a>`;
 }).join('')||'<p class="subtitle">Không tìm thấy slide phù hợp.</p>';
}
function updateNav(){pageInput.value=current+1;document.getElementById('page-total').textContent='/ '+slides.length;pageInput.max=slides.length;document.getElementById('chapter-name').textContent=slides[current].ch;document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.querySelectorAll('.toc-link').forEach(a=>a.classList.toggle('current',Number(a.dataset.goto)===current));}
function go(n,changeHash=true){current=clamp(Number(n)||0,0,slides.length-1);sections.forEach((s,j)=>{s.classList.toggle('active',j===current);s.setAttribute('aria-hidden',!reading&&j!==current?'true':'false');});updateNav();if(changeHash)history.replaceState(null,'','#'+(current+1));if(reading)sections[current].scrollIntoView({behavior:'auto',block:'start'});else window.scrollTo({top:0,behavior:'instant'});}
renderToc();
document.getElementById('toc-toggle').onclick=()=>setToc(toc.hidden);
document.getElementById('toc-close').onclick=()=>{setToc(false);document.getElementById('toc-toggle').focus()};
document.getElementById('search').oninput=e=>renderToc(e.target.value);
document.getElementById('toc-list').onclick=e=>{const a=e.target.closest('[data-goto]');if(a){e.preventDefault();go(+a.dataset.goto);setToc(false)}};
document.getElementById('next').onclick=()=>go(current+1);
document.getElementById('prev').onclick=()=>go(current-1);
pageInput.onchange=()=>go(+pageInput.value-1);
document.getElementById('reading-toggle').onclick=()=>{reading=!reading;document.body.classList.toggle('reading',reading);const b=document.getElementById('reading-toggle');b.textContent=reading?'Trình chiếu':'Đọc liền';b.setAttribute('aria-pressed',reading);go(current)};
document.getElementById('print').onclick=()=>window.print();
addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1),10)||1)-1,false));
addEventListener('keydown',e=>{
 if(e.key==='Escape'){setToc(false);return}
 if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,summary,a')||document.querySelector('dialog[open]'))return;
 if(e.target.closest('button')&&[' ','Enter'].includes(e.key))return;
 if(['ArrowRight','PageDown'].includes(e.key)||(!reading&&e.key===' ')){e.preventDefault();go(current+1)}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}
 else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}
 else if(e.key.toLowerCase()==='m'){e.preventDefault();setToc(toc.hidden)}
});
let scrollScheduled=false;
addEventListener('scroll',()=>{if(!reading||scrollScheduled)return;scrollScheduled=true;requestAnimationFrame(()=>{scrollScheduled=false;let best=0;sections.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.42)best=i});if(best!==current){current=best;updateNav();history.replaceState(null,'','#'+(current+1));}})});
let touchStart=null;
deck.addEventListener('touchstart',e=>{if(e.target.closest('input,button,a,.table-wrap')){touchStart=null;return}touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
deck.addEventListener('touchend',e=>{if(!touchStart||reading)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2)go(current+(dx<0?1:-1))},{passive:true});

function kink(){const h=+document.getElementById('kink-h').value,X=v=>280+v*2400,Y=v=>178-v*1450;let out=line(40,178,520,178)+line(280,24,280,196)+`<polyline points="${X(-.08)},${Y(.08)} 280,178 ${X(.08)},${Y(.08)}" fill="none" stroke="#126b59" stroke-width="3"/><circle cx="${X(h)}" cy="${Y(Math.abs(h))}" r="7" fill="#b7502f"/>`+txt(301,25,'|h|','#126b59',15)+txt(500,200,'h','#52635e',14)+txt(68,202,'−0,08','#52635e',12)+txt(450,202,'+0,08','#52635e',12)+txt(269,200,'0','#52635e',12);document.getElementById('kink-viz').innerHTML=svg(out,218);document.getElementById('kink-h-out').textContent=fmt(h,3);document.getElementById('kink-result').textContent=`h = ${fmt(h,3)}: tại tie, cost tăng |h| = ${fmt(Math.abs(h),3)}; tại d = −0,1, cost đổi −h = ${fmt(-h,3)}.`;}
document.getElementById('kink-h').oninput=kink;kink();

function limitChart(){let seed=927461;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return(seed+.5)/4294967296};const bins=50,lo=-2.5,hi=3.5,counts=Array(bins).fill(0),N=80000,sdA=Math.sqrt(.32),coef=-.1/sdA,sdR=Math.sqrt(.37-coef*coef);let sum=0;
 for(let i=0;i<N;i++){let r=Math.sqrt(-2*Math.log(rand())),t=2*Math.PI*rand(),z1=r*Math.cos(t),z2=r*Math.sin(t),value=Math.abs(sdA*z1)+coef*z1+sdR*z2;sum+=value;let b=Math.floor((value-lo)/(hi-lo)*bins);if(b>=0&&b<bins)counts[b]++;}
 const X=x=>45+(x-lo)/(hi-lo)*475,Y=y=>200-y*250,bw=(hi-lo)/bins;let out=line(45,200,520,200);counts.forEach((n,i)=>{let y=n/N/bw;out+=`<rect x="${X(lo+i*bw)}" y="${Y(y)}" width="${475/bins-.6}" height="${200-Y(y)}" fill="#126b59" opacity=".8"/>`;});
 let d='',variance=.37+.32*(1-2/Math.PI);for(let i=0;i<=180;i++){let x=lo+(hi-lo)*i/180,y=Math.exp(-x*x/(2*variance))/Math.sqrt(2*Math.PI*variance);d+=`${i?'L':'M'}${X(x)},${Y(y)} `;}out+=`<path d="${d}" fill="none" stroke="#b7502f" stroke-width="2.5"/>`;for(let i=-2;i<=3;i++)out+=txt(X(i),221,i,'#52635e',11,'middle');out+=line(X(.45135),25,X(.45135),201,'#689844',1.5)+txt(315,20,'Mean lý thuyết ≈ 0,4514','#126b59',12)+txt(46,20,'Mật độ','#52635e',11);document.getElementById('limit-viz').innerHTML=svg(out,240);window.limitSimulation={mean:sum/N,N};}
limitChart();

document.querySelectorAll('.quiz').forEach(q=>q.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const ok=b.dataset.choice===q.dataset.answer;q.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const f=q.querySelector('.quiz-feedback');f.textContent=ok?'Đúng. Hãy nối kết luận với công thức và các đặc điểm phía dưới.':q.dataset.answer==='1'?'Chưa đúng. Biên đúng chưa đủ, và bicausal không buộc độc lập. Hãy so P(Y₂ | Y₁) với P(Y₂ | Y₁, X₁).':'Chưa đúng. Định lý chỉ làm kernel ước lượng tiến tới kernel thật của mô hình đã chọn. Quy tắc coupling và biểu diễn vẫn giữ nguyên.';f.style.color=ok?'var(--green)':'var(--orange)';}));

const tablesDialog=document.createElement('dialog');tablesDialog.id='tables-dialog';tablesDialog.innerHTML=`<div class="toc-head"><h2>Bảng gốc · chỉ để tra cứu</h2><button id="tables-close" aria-label="Đóng các bảng">×</button></div><p class="subtitle">Số liệu chép từ PDF được cung cấp; chưa chạy lại thực nghiệm. Dấu thập phân trong bảng dùng quy ước của paper.</p><label for="table-select" class="sr-only">Chọn bảng</label><select id="table-select">${paperTables.map((t,i)=>`<option value="${i}">Bảng ${i+1}: ${t.name}</option>`).join('')}</select><div id="paper-table-body"></div>`;document.body.appendChild(tablesDialog);
function showTable(i){const t=paperTables[i];document.getElementById('paper-table-body').innerHTML=`<p class="subtitle">${t.note} <a href="paper.pdf#page=${t.page}" target="_blank">PDF tr. ${t.page} ↗</a></p>${table(t.head,t.rows)}`;}
document.querySelectorAll('.open-tables').forEach(b=>b.onclick=()=>{showTable(0);document.getElementById('table-select').value=0;tablesDialog.showModal();});document.getElementById('tables-close').onclick=()=>tablesDialog.close();document.getElementById('table-select').onchange=e=>showTable(+e.target.value);tablesDialog.onclick=e=>{if(e.target===tablesDialog){const r=tablesDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)tablesDialog.close();}};
go((parseInt(location.hash.slice(1),10)||1)-1,false);
</script></body></html>
